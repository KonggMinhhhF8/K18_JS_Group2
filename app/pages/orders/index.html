<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đơn Hàng | ShopAdmin Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #3498db;
            --primary-dark: #2980b9;
            --dark: #2c3e50;
            --light-bg: #f4f7f6;
            --success: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --white: #ffffff;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--light-bg); color: var(--text-main); line-height: 1.6; }
        .app-container { display: flex; min-height: 100vh; }

        .sidebar { width: 260px; background: var(--dark); color: white; padding: 25px; position: sticky; top: 0; height: 100vh; transition: all 0.3s ease; }
        .sidebar h2 { margin-bottom: 40px; text-align: center; color: var(--primary); font-size: 1.5rem; letter-spacing: 1px; }
        .sidebar ul { list-style: none; }
        .sidebar ul li { padding: 12px 15px; cursor: pointer; border-radius: 8px; margin-bottom: 8px; color: #ecf0f1; transition: 0.2s; display: flex; align-items: center; }
        .sidebar ul li i { margin-right: 12px; width: 20px; text-align: center; }
        .sidebar ul li:hover, .sidebar ul li.active { background: rgba(52, 152, 219, 0.2); color: var(--primary); }

        .main-content { flex: 1; padding: 30px; overflow-x: hidden; }
        header { display: flex; justify-content: space-between; align-items: center; background: var(--white); padding: 15px 25px; border-radius: var(--radius); margin-bottom: 30px; box-shadow: var(--shadow); }
        .search-bar { position: relative; flex: 1; max-width: 400px; }
        .search-bar i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-bar input { padding: 10px 15px 10px 40px; width: 100%; border: 1px solid #ddd; border-radius: 25px; outline: none; transition: border 0.3s; }
        .search-bar input:focus { border-color: var(--primary); }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--white); padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); border-left: 5px solid #ccc; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-3px); }
        .stat-card.blue { border-left-color: var(--primary); }
        .stat-card.orange { border-left-color: var(--warning); }
        .stat-card.green { border-left-color: var(--success); }
        .stat-card.red { border-left-color: var(--danger); }
        .stat-card h3 { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; }
        .stat-card p { font-size: 1.8rem; font-weight: bold; }

        .order-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px; flex-wrap: wrap; }
        .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
        .tab { padding: 8px 18px; border: none; background: #e0e0e0; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: 0.3s; }
        .tab.active { background: var(--dark); color: white; }
        .table-wrapper { background: var(--white); padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { text-align: left; padding: 15px; background: #f8f9fa; color: var(--text-muted); font-size: 0.85rem; border-bottom: 2px solid #eee; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #eee; vertical-align: middle; }

        .badge { padding: 5px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; display: inline-block; }
        .badge.pending { background: #fff3e0; color: #e67e22; }
        .badge.shipping { background: #e1f5fe; color: #0288d1; }
        .badge.completed { background: #e8f5e9; color: #27ae60; }
        .badge.cancelled { background: #ffebee; color: #c0392b; }

        .btn-action { border: none; background: #f0f2f5; width: 34px; height: 34px; border-radius: 8px; cursor: pointer; color: #555; margin-right: 5px; transition: 0.2s; }
        .btn-action:hover { background: var(--primary); color: white; }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .btn-primary:hover { background: var(--primary-dark); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal-content { background: white; padding: 30px; border-radius: 15px; max-width: 500px; width: 90%; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .close-modal { position: absolute; right: 20px; top: 20px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #999; }

        @media (max-width: 992px) { .sidebar { width: 80px; padding: 20px 10px; } .sidebar h2, .sidebar span { display: none; } .sidebar ul li { justify-content: center; padding: 15px 0; } .sidebar ul li i { margin: 0; font-size: 1.2rem; } }
        @media (max-width: 768px) { .app-container { flex-direction: column; } .sidebar { width: 100%; height: auto; position: static; padding: 10px; order: 2; } .sidebar ul { display: flex; justify-content: space-around; } .sidebar ul li { margin-bottom: 0; } .main-content { padding: 15px; order: 1; } header { flex-direction: column; gap: 15px; } .search-bar { max-width: 100%; } .order-controls { flex-direction: column; align-items: stretch; } }
    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <h2>ShopAdmin</h2>
        <ul>
            <li><i class="fas fa-home"></i> <span>Tổng quan</span></li>
            <li><i class="fas fa-box"></i> <span>Sản phẩm</span></li>
            <li class="active"><i class="fas fa-shopping-cart"></i> <span>Đơn hàng</span></li>
            <li><i class="fas fa-users"></i> <span>Khách hàng</span></li>
            <li><i class="fas fa-chart-line"></i> <span>Báo cáo</span></li>
        </ul>
    </aside>

    <main class="main-content">
        <header>
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="orderSearch" placeholder="Tìm mã đơn, tên khách hàng...">
            </div>
            <button class="btn-primary" id="btnExport"><i class="fas fa-file-export"></i> Xuất CSV</button>
        </header>

        <section class="stats-grid">
            <div class="stat-card blue"><h3>Tổng đơn hàng</h3><p id="stat-total">0</p></div>
            <div class="stat-card orange"><h3>Đang xử lý</h3><p id="stat-pending">0</p></div>
            <div class="stat-card green"><h3>Thành công</h3><p id="stat-completed">0</p></div>
            <div class="stat-card red"><h3>Đã hủy</h3><p id="stat-cancelled">0</p></div>
        </section>

        <section>
            <div class="order-controls">
                <div class="tabs" id="statusTabs">
                    <button class="tab active" data-status="all">Tất cả</button>
                    <button class="tab" data-status="pending">Chờ xử lý</button>
                    <button class="tab" data-status="shipping">Đang giao</button>
                    <button class="tab" data-status="completed">Đã xong</button>
                </div>
                <div class="date-filter"><input type="date" id="dateFilter" style="padding: 8px; border: 1px solid #ddd; border-radius: 8px; outline: none;"></div>
            </div>

            <div class="table-wrapper">
                <table id="ordersTable">
                    <thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Sản phẩm</th><th>Ngày đặt</th><th>Tổng tiền</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<div class="modal-overlay" id="orderModal">
    <div class="modal-content">
        <button class="close-modal" id="closeModal">&times;</button>
        <div id="modalBody"></div>
        <div style="margin-top: 25px; text-align: right;">
            <button class="btn-primary" id="modalPrintBtn"><i class="fas fa-print"></i> In đơn hàng</button>
        </div>
    </div>
</div>

<script>
    const ordersData = [
        { id: '#ORD-7721', customer: 'Nguyễn Văn An', phone: '0912.345.xxx', products: 'iPhone 15 Pro Max (x1)', total: 32500000, status: 'shipping', date: '2026-03-24' },
        { id: '#ORD-7722', customer: 'Lê Thị Bình', phone: '0988.777.xxx', products: 'AirPods Pro (x2), Case (x2)', total: 11200000, status: 'completed', date: '2026-03-22' },
        { id: '#ORD-7723', customer: 'Phạm Minh Cường', phone: '0355.123.xxx', products: 'Ốp lưng Silicon', total: 250000, status: 'pending', date: '2026-03-25' },
        { id: '#ORD-7724', customer: 'Hoàng Anh Tuấn', phone: '0909.888.xxx', products: 'Sạc nhanh 20W', total: 490000, status: 'cancelled', date: '2026-03-20' },
        { id: '#ORD-7725', customer: 'Trần Văn Dũng', phone: '0933.112.xxx', products: 'MacBook Pro 14" (x1)', total: 57900000, status: 'shipping', date: '2026-03-21' },
        { id: '#ORD-7726', customer: 'Ngô Thị Hà', phone: '0916.876.xxx', products: 'Huawei Watch (x1)', total: 5200000, status: 'completed', date: '2026-03-19' }
    ];

    const state = { filters: { keyword: '', status: 'all', date: '' }, activeOrder: null };

    const formatMoney = (val) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(val);
    const formatDate = (val) => { const d = new Date(val); return isNaN(d) ? val : d.toLocaleDateString('vi-VN'); };
    const getStatusInfo = (status) => ({ pending: { text:'Chờ xử lý', class:'pending' }, shipping:{text:'Đang giao',class:'shipping'}, completed:{text:'Hoàn thành',class:'completed'}, cancelled:{text:'Đã hủy',class:'cancelled'} }[status] || { text:'N/A', class:'' });

    function updateStats() {
        document.getElementById('stat-total').textContent = ordersData.length;
        document.getElementById('stat-pending').textContent = ordersData.filter(o => o.status==='pending').length;
        document.getElementById('stat-completed').textContent = ordersData.filter(o => o.status==='completed').length;
        document.getElementById('stat-cancelled').textContent = ordersData.filter(o => o.status==='cancelled').length;
    }

    function showModal(order, autoPrint = false) {
        state.activeOrder = order;
        const modal = document.getElementById('orderModal');
        const body = document.getElementById('modalBody');
        const status = getStatusInfo(order.status);

        body.innerHTML = `
            <h2 style="margin-bottom: 20px;">Chi tiết đơn hàng ${order.id}</h2>
            <p><strong>Khách hàng:</strong> ${order.customer}</p>
            <p><strong>Số điện thoại:</strong> ${order.phone}</p>
            <p><strong>Sản phẩm:</strong> ${order.products}</p>
            <p><strong>Ngày đặt:</strong> ${formatDate(order.date)}</p>
            <p><strong>Tổng tiền:</strong> ${formatMoney(order.total)}</p>
            <p><strong>Trạng thái:</strong> <span class="badge ${status.class}">${status.text}</span></p>
        `;

        modal.style.display = 'flex';

        if (autoPrint) {
            setTimeout(() => document.getElementById('modalPrintBtn').click(), 120);
        }
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        const filtered = ordersData.filter(order => {
            const matchStatus = state.filters.status === 'all' || order.status === state.filters.status;
            const matchDate = !state.filters.date || order.date === state.filters.date;
            const keyword = state.filters.keyword.toLowerCase();
            const matchKeyword = !keyword || [order.id, order.customer, order.phone, order.products].some(text => text.toLowerCase().includes(keyword));
            return matchStatus && matchDate && matchKeyword;
        });

        if (!filtered.length) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:40px; color:#999;">Không tìm thấy kết quả phù hợp</td></tr>';
            return;
        }

        tbody.innerHTML = '';
        filtered.forEach(order => {
            const status = getStatusInfo(order.status);
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${order.id}</strong></td>
                <td><div><strong>${order.customer}</strong></div><small style="color:#7f8c8d">${order.phone}</small></td>
                <td>${order.products}</td>
                <td>${formatDate(order.date)}</td>
                <td><strong>${formatMoney(order.total)}</strong></td>
                <td><span class="badge ${status.class}">${status.text}</span></td>
                <td>
                    <button class="btn-action view-btn" title="Xem chi tiết"><i class="fas fa-eye"></i></button>
                    <button class="btn-action print-btn" title="In đơn"><i class="fas fa-print"></i></button>
                </td>
            `;

            tr.querySelector('.view-btn').onclick = () => showModal(order);
            tr.querySelector('.print-btn').onclick = () => showModal(order, true);
            tbody.appendChild(tr);
        });
    }

    function initEvents() {
        document.getElementById('orderSearch').oninput = (e) => { state.filters.keyword = e.target.value.trim(); renderTable(); };

        document.getElementById('statusTabs').onclick = (e) => {
            if (!e.target.classList.contains('tab')) return;
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            e.target.classList.add('active');
            state.filters.status = e.target.dataset.status;
            renderTable();
        };

        document.getElementById('dateFilter').onchange = (e) => { state.filters.date = e.target.value; renderTable(); };

        document.getElementById('closeModal').onclick = () => { document.getElementById('orderModal').style.display = 'none'; };
        document.getElementById('orderModal').onclick = (e) => { if (e.target.id === 'orderModal') document.getElementById('orderModal').style.display = 'none'; };

        document.getElementById('modalPrintBtn').onclick = () => {
            if (!state.activeOrder) return;
            window.print();
        };

        document.getElementById('btnExport').onclick = () => {
            const rows = ordersData.map(o => [o.id, o.customer, o.phone, `"${o.products}"`, o.date, o.total, getStatusInfo(o.status).text]);
            const csv = [ ['Mã đơn','Khách hàng','SĐT','Sản phẩm','Ngày đặt','Tổng tiền','Trạng thái'], ...rows ].map(r => r.join(',')).join('\n');
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=UTF-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `orders_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
        };
    }

    window.onload = () => { updateStats(); initEvents(); renderTable(); };
</script>
</body>
</html>
