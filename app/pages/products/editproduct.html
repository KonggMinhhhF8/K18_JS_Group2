<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chỉnh sửa sản phẩm | ShopAdmin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
      :root {
          --primary-color: #3498db;
          --dark-color: #2c3e50;
          --bg-color: #f4f7f6;
          --success: #27ae60;
          --border: #dcdde1;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
      body { background-color: var(--bg-color); color: var(--dark-color); }
      .container { display: flex; min-height: 100vh; }

      
            /* Sidebar */
            .sidebar {
                width: 260px;
                background: var(--dark-color);
                color: white;
                padding: 25px;
                position: fixed;
                height: 100vh;
                left: 0;
                z-index: 1000;
                transition: 0.3s;
            }
            .sidebar h2 {
                margin-bottom: 30px;
                text-align: center;
                color: var(--primary-color);
            }
            .sidebar ul {
                list-style: none;
            }
            .sidebar ul li {
                padding: 15px;
                cursor: pointer;
                border-radius: 8px;
                margin-bottom: 5px;
                display: flex;
                align-items: center;
                transition: 0.3s;
            }
            .sidebar ul li i {
                margin-right: 15px;
            }
            .sidebar ul li a {
                color: #ecf0f1;
                text-decoration: none;
                width: 100%;
            }
            .sidebar ul li.active {
                background: #34495e;
                color: var(--primary-color);
            }
            .sidebar ul li:hover,
            .sidebar ul li.active {
                background: #34495e;
                color: var(--primary-color);
            }
            .sidebar ul li:hover a,
            .sidebar ul li.active a {
                color: var(--primary-color);
            }
      .main-content { flex: 1;
    margin-left: 260px;
    padding: 25px;
    width: 100%;
    transition: 0.3s; }

      .header-actions {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 30px;
      }

      .btn-back {
          text-decoration: none;
          color: #7f8c8d;
          font-weight: 500;
      }

      .product-grid {
          display: grid;
          grid-template-columns: 2fr 1fr;
          gap: 30px;
      }

      .card {
          background: white;
          padding: 25px;
          border-radius: 12px;
          box-shadow: 0 4px 6px rgba(0,0,0,0.05);
          margin-bottom: 20px;
      }

      .card h3 {
          margin-bottom: 20px;
          font-size: 1.1rem;
          border-bottom: 1px solid #eee;
          padding-bottom: 10px;
      }

      .form-group { margin-bottom: 20px; }

      .form-group label {
          display: block;
          margin-bottom: 8px;
          font-weight: 600;
          font-size: 0.9rem;
      }

      .form-group input,
      .form-group select,
      .form-group textarea {
          width: 100%;
          padding: 12px;
          border: 1px solid var(--border);
          border-radius: 8px;
          outline: none;
          transition: 0.3s;
      }

      .form-group input:focus,
      .form-group select:focus,
      .form-group textarea:focus {
          border-color: var(--primary-color);
      }

      .image-upload {
          border: 2px dashed var(--border);
          border-radius: 12px;
          padding: 40px;
          text-align: center;
          cursor: pointer;
          transition: 0.3s;
      }

      .image-upload:hover {
          border-color: var(--primary-color);
          background: #f0f7ff;
      }

      .image-upload i {
          font-size: 2rem;
          color: #bdc3c7;
          margin-bottom: 10px;
      }

      .preview-img {
          width: 100%;
          margin-top: 15px;
          border-radius: 8px;
          display: none;
      }

      .form-footer {
          margin-top: 20px;
          display: flex;
          justify-content: flex-end;
          gap: 15px;
          padding: 20px;
          background: white;
          border-radius: 12px;
      }

      .btn {
          padding: 12px 25px;
          border-radius: 8px;
          border: none;
          font-weight: 600;
          cursor: pointer;
      }

      .btn-save {
          background: var(--success);
          color: white;
      }

      .btn-cancel {
          background: #eee;
          color: #7f8c8d;
      }
  </style>
</head>
<body>
<div class="container">
  

  <main class="main-content">
    <div class="header-actions">
      <a href="#" id="btnBackToProducts" class="btn-back">
        <i class="fas fa-arrow-left"></i> Quay lại danh sách
      </a>
      <h2>Chỉnh sửa sản phẩm</h2>
    </div>

    <form id="productForm">
      <div class="product-grid">
        <div class="left-col">
          <div class="card">
            <h3>Thông tin chung</h3>

            <div class="form-group">
              <label for="productName">Tên sản phẩm</label>
              <input id="productName" name="name" type="text" placeholder="Ví dụ: iPhone 15 Pro Max">
            </div>

            <div class="form-group">
              <label for="productDescription">Mô tả sản phẩm</label>
              <textarea id="productDescription" name="description" rows="5" placeholder="Nhập đặc điểm nổi bật..."></textarea>
            </div>
          </div>

          <div class="card">
            <h3>Giá cả & Kho hàng</h3>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
              <div class="form-group">
                <label for="productPrice">Giá bán (VNĐ)</label>
                <input id="productPrice" name="price" type="number" min="0" placeholder="Nhập giá bán">
              </div>

              <div class="form-group">
                <label for="productCost">Giá vốn (VNĐ)</label>
                <input id="productCost" name="cost" type="number" min="0" placeholder="Nhập giá vốn">
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
              <div class="form-group">
                <label for="productSku">Mã SKU</label>
                <input id="productSku" name="sku" type="text" placeholder="Ví dụ: IP15PM-BLUE-256">
              </div>

              <div class="form-group">
                <label for="productStock">Số lượng tồn kho</label>
                <input id="productStock" name="stock" type="number" min="0" placeholder="Nhập số lượng tồn kho">
              </div>
            </div>
          </div>
        </div>

        <div class="right-col">
          <div class="card">
            <h3>Hình ảnh sản phẩm</h3>
            <div class="image-upload" onclick="document.getElementById('fileInput').click()">
              <i class="fas fa-cloud-upload-alt"></i>
              <p>Nhấp để tải ảnh lên</p>
              <input type="file" id="fileInput" hidden onchange="previewImage(event)">
              <img id="imgPreview" class="preview-img" src="" alt="Preview">
            </div>
          </div>

          <div class="card">
            <h3>Phân loại</h3>

            <div class="form-group">
              <label for="productCategory">Danh mục</label>
              <select id="productCategory" name="category">
                <option value="">Chọn danh mục</option>
                <option value="Điện thoại">Điện thoại</option>
                <option value="Máy tính bảng">Máy tính bảng</option>
                <option value="Phụ kiện">Phụ kiện</option>
                <option value="Laptop">Laptop</option>
                <option value="Thiết bị gaming">Thiết bị gaming</option>
                <option value="Linh kiện PC">Linh kiện PC</option>
              </select>
            </div>

            <div class="form-group">
              <label for="productStatus">Trạng thái</label>
              <select id="productStatus" name="status">
                <option value="Đang bán">Đang bán</option>
                <option value="Ngừng kinh doanh">Ngừng kinh doanh</option>
                <option value="Hết hàng">Hết hàng</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="form-footer">
        <button id="btnCancelEdit" type="button" class="btn btn-cancel">Hủy bỏ</button>
        <button type="submit" class="btn btn-save">Lưu thay đổi</button>
      </div>
    </form>
  </main>
</div>

<script>
  function previewImage(event) {
    const file = event?.target?.files?.[0];
    const output = document.getElementById('imgPreview');

    if (!file || !output) return;

    const reader = new FileReader();
    reader.onload = function () {
      output.src = reader.result;
      output.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }

  window.previewImage = previewImage;
</script>

<script type="module" src="./editproduct.js"></script>
</body>
</html>
