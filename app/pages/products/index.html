<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Sản Phẩm | ShopAdmin</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container">
  <main class="main-content">
    <header>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Tìm tên sản phẩm, mã SKU...">
      </div>
      <div class="user-actions">
        <button id="btnAddProduct" class="btn-add">
          <i class="fas fa-plus"></i> Thêm sản phẩm
        </button>
      </div>
    </header>

    <section class="stats">
      <div class="card">
        <h3>Tổng sản phẩm</h3>
        <p id="totalProductsValue">0</p>
      </div>
      <div class="card">
        <h3>Sắp hết hàng</h3>
        <p id="lowStockValue" style="color: #e74c3c;">0</p>
      </div>
      <div class="card">
        <h3>Danh mục</h3>
        <p id="totalCategoriesValue">0</p>
      </div>
    </section>

    <div id="products-table-root"></div>
  </main>
</div>

<div id="productModal" class="modal">
  <div class="modal-content">
    <h3 id="productModalTitle">Thêm sản phẩm mới</h3>

    <form id="productForm">
      <input id="productName" name="name" type="text" placeholder="Tên sản phẩm" required>

      <select id="productCategory" name="category" required>
        <option value="">Chọn danh mục</option>
      </select>

      <input id="productPrice" name="price" type="number" min="0" placeholder="Giá bán" required>
      <input id="productStock" name="stock" type="number" min="0" placeholder="Số lượng tồn kho" required>

      <div class="modal-buttons">
        <button id="btnCloseProduct" type="button" class="btn-cancel">Hủy</button>
        <button id="productSubmitButton" type="submit" class="btn-add">Lưu sản phẩm</button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="../products/products.js"></script>
</body>
</html>
